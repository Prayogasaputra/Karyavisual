<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayogasaputra | Words & Visual</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Poppins:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050505;
      color: white;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      position: relative;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.95)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1470&auto=format&fit=crop') center/cover;
    }

    .hero-content {
      max-width: 800px;
      animation: fadeIn 2s ease;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      font-weight: 500;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 1rem;
      color: #d0d0d0;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .creator {
      font-size: 0.9rem;
      color: #999;
      letter-spacing: 3px;
    }

    .gallery-section {
      padding: 80px 20px;
      max-width: 1400px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 60px;
    }

    .section-title h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      font-weight: 400;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #999;
      letter-spacing: 2px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 40px;
      max-width: 900px;
      margin: auto;
    }

    .poster {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #111;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: 0.4s ease;
    }

    .poster:hover {
      transform: translateY(-8px);
    }

    .poster img {
      border-radius: 20px;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: 0.5s ease;
    }

    .poster:hover img {
      transform: scale(1.03);
      opacity: 0.8;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      opacity: 0;
      transition: 0.4s ease;
      display: flex;
      align-items: end;
      padding: 20px;
    }

    .poster:hover .overlay {
      opacity: 1;
    }

    .overlay h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 400;
    }

    footer {
      text-align: center;
      padding: 50px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #777;
      font-size: 0.9rem;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width:768px) {
      .poster {
        min-height: 80vh;
      }

      .hero h1 {
        font-size: 3rem;
      }

      .section-title h2 {
        font-size: 2.3rem;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="hero-content">
      <h1>Words & Visual</h1>
      <p>
        Sebuah ruang untuk kata-kata yang tak sempat diucapkan,
        dan visual yang mencoba menjelaskan arti kehidupan.
      </p>
      <div class="creator">@PRAYOGASAPUTRA</div>
    </div>
  </section>

  <section class="gallery-section">
    <div class="section-title">
      <h2>Gallery Poster</h2>
      <p>melankolis • cinematic • reflection</p>
    </div>

    <div class="gallery" id="gallery"></div>
  </section>

    <div style="text-align:center; color:#777; padding:10px 20px 50px; font-size:0.9rem;">
    Scroll ke bawah untuk melihat semua karya.
  </div>

  <footer>
    © 2026 — CREATED BY @PRAYOGASAPUTRA
  </footer>

  <script>
    /*

    ========================================
    CARA MENAMBAHKAN POSTER BARU
    ========================================

    1. Upload gambar poster ke folder:
       /images

    2. Tambahkan nama file di bawah ini.

    CONTOH:
    {
      image: 'images/poster1.jpg',
      title: 'Tentang Waktu'
    }

    3. Tidak perlu mengubah CSS.

    ========================================

    */

    const posters = [

      {
        image: 'images/poster1.jpg',
        title: 'Tentang Waktu'
      },

      {
        image: 'images/poster2.jpg',
        title: 'Tentang Kehidupan'
      },

      {
        image: 'images/poster3.jpg',
        title: 'Tentang Menerima'
      },

      {
        image: 'images/poster4.jpg',
        title: 'Tentang Perubahan'
      }

    ];

    const gallery = document.getElementById('gallery');

    posters.forEach(poster => {
      gallery.innerHTML += `
        <div class="poster">
          <img src="${poster.image}" alt="${poster.title}">
          <div class="overlay">
            <h3>${poster.title}</h3>
          </div>
        </div>
      `;
    });
  </script>

</body>
</html>
